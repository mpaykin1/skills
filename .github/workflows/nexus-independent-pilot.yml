name: Nexus independent runner pilot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-independent-pilot.yml'
permissions:
  contents: read
jobs:
  skill-source-pilot:
    if: github.head_ref == 'nexus/triple-pilot-1-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load exact GitHub skill sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check actual catalog and execute Nexus skill script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          root = pathlib.Path.cwd()
          catalog = json.loads((root / 'catalog.json').read_text())
          packages = catalog['packages']
          nexus = next(x for x in packages if x['name'] == 'skill-synergy-manager')
          path = root / 'packages/skill-synergy-manager/skills/nexus-automation-supervisor/SKILL.md'
          skill = path.read_text(encoding='utf-8')
          assert 'nexus_automation_audit.py' in skill
          print('Nexus source loaded:', path.relative_to(root), 'version:', nexus['version'])
          def check_catalog():
              missing = []
              total = 0
              for package in packages:
                  paths = set(package.get('skills') or [])
                  if package.get('skill'): paths.add(package['skill'])
                  for name in sorted(paths):
                      total += 1
                      if not (root / name).is_file(): missing.append((package['name'], name))
              print('Actual catalog:', len(packages), 'packages;', total, 'declared skill paths;', len(missing), 'missing')
              for name, source in missing: print('Missing catalog source:', name, source)
              if missing: raise SystemExit(1)
          check_catalog()
          # Negative control in the disposable checkout; always restore.
          hidden = path.with_name('SKILL.md.pilot-hidden')
          assert not hidden.exists()
          path.rename(hidden)
          try:
              try:
                  check_catalog()
              except SystemExit as exc:
                  assert exc.code == 1
                  print('CATALOG_NEGATIVE_CONTROL_PASS: missing source rejected')
              else:
                  raise RuntimeError('Missing source was accepted')
          finally:
              hidden.rename(path)
          check_catalog()
          print('CATALOG_GUARD_PASS')
          # Controlled smoke fixture, not historical automation evidence.
          snapshot = {'automations': [
              {'id':'pilot-idle','is_enabled':True,'run_details':{'last_run':{'id':'1','recorded_status':'completed'},'latest_result':{'run_id':'1','content_text':'0 п.п.'}}},
              {'id':'pilot-fail','is_enabled':True,'run_details':{'last_run':{'id':'2','recorded_status':'failed'}}},
              {'id':'pilot-no-result','is_enabled':True,'run_details':{'last_run':{'id':'3','recorded_status':'completed'}}},
              {'id':'pilot-with-result','is_enabled':True,'run_details':{'last_run':{'id':'4','recorded_status':'completed'},'latest_result':{'run_id':'4','content_text':'done'}}},
              {'id':'pilot-stale','is_enabled':True,'run_details':{'last_run':{'id':'5','recorded_status':'completed'},'latest_result':{'run_id':'old','content_text':'no commits','is_failure_message':True,'requires_user_action':True,'content_truncated':True}}},
              {'id':'pilot-fresh','is_enabled':True,'run_details':{'last_run':{'id':'6','recorded_status':'completed'},'latest_result':{'run_id':'6','content_text':'no commits','requires_user_action':True}}},
              {'id':'pilot-unlinked-result','is_enabled':True,'run_details':{'last_run':{'id':'7','recorded_status':'completed'},'latest_result':{'content_text':'no commits','is_failure_message':True,'requires_user_action':True,'content_truncated':True}}},
              {'id':'pilot-unlinked-run','is_enabled':True,'run_details':{'last_run':{'recorded_status':'completed'},'latest_result':{'run_id':'8','content_text':'no commits','is_failure_message':True}}},
              {'id':'pilot-linked-failure','is_enabled':True,'run_details':{'last_run':{'id':'9','recorded_status':'completed'},'latest_result':{'run_id':'9','content_text':'no commits','is_failure_message':True}}}
          ]}
          with tempfile.TemporaryDirectory() as tmp:
              p = pathlib.Path(tmp)
              (p/'snapshot.json').write_text(json.dumps(snapshot), encoding='utf-8')
              subprocess.run(['python3',str(root/'packages/skill-synergy-manager/scripts/nexus_automation_audit.py'),str(p/'snapshot.json'),'--out',str(p/'audit.json')],check=True)
              result = json.loads((p/'audit.json').read_text())
              assert result['active_tasks_checked'] == 9
              kinds = {i['kind'] for t in result['tasks'] for i in t['issues']}
              assert {'possibly_idle_run','failed'} <= kinds, result
              by_id = {t['task_id']: t for t in result['tasks']}
              assert {'kind':'completed_without_result','certainty':'observed'} in by_id['pilot-no-result']['issues']
              assert by_id['pilot-no-result']['code_change'] == 'unverified'
              assert not by_id['pilot-with-result']['issues']
              print('COMPLETED_WITHOUT_RESULT_PASS')
              stale = by_id['pilot-stale']
              assert {i['kind'] for i in stale['issues']} == {'stale_result','completed_without_result'}, stale
              assert not stale['has_result'] and stale['code_change'] == 'unverified'
              assert {'kind':'stale_result','certainty':'observed'} in stale['issues']
              fresh = by_id['pilot-fresh']
              assert fresh['has_result'] and {i['kind'] for i in fresh['issues']} == {'possibly_idle_run','requires_user_action'}, fresh
              print('STALE_RESULT_GUARD_PASS')
              for key in ('pilot-unlinked-result', 'pilot-unlinked-run'):
                  item = by_id[key]
                  assert {i['kind'] for i in item['issues']} == {'unlinked_result','completed_without_result'}, item
                  assert {'kind':'unlinked_result','certainty':'observed'} in item['issues']
                  assert not item['has_result'] and item['code_change'] == 'unverified'
              linked = by_id['pilot-linked-failure']
              assert linked['has_result'] and {i['kind'] for i in linked['issues']} == {'failed','possibly_idle_run'}, linked
              print('UNLINKED_RESULT_GUARD_PASS')
              print('Existing Nexus audit executed; controlled fixture classified correctly:', sorted(kinds))
          print('SOURCE_RUNNER_PASS; native ChatGPT skill access and native installed skill execution not tested')
          PY
