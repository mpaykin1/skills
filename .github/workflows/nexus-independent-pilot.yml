name: Nexus independent runner pilot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-independent-pilot.yml'
permissions:
  contents: read
jobs:
  skill-source-pilot:
    if: github.head_ref == 'nexus/autonomous-catalog-guard-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load exact GitHub skill sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check actual catalog and execute Nexus skill script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          root = pathlib.Path.cwd()
          catalog = json.loads((root / 'catalog.json').read_text())
          packages = catalog['packages']
          nexus = next(x for x in packages if x['name'] == 'skill-synergy-manager')
          path = root / 'packages/skill-synergy-manager/skills/nexus-automation-supervisor/SKILL.md'
          skill = path.read_text(encoding='utf-8')
          assert 'nexus_automation_audit.py' in skill
          print('Nexus source loaded:', path.relative_to(root), 'version:', nexus['version'])
          def check_catalog():
              missing = []
              total = 0
              for package in packages:
                  paths = set(package.get('skills') or [])
                  if package.get('skill'): paths.add(package['skill'])
                  for name in sorted(paths):
                      total += 1
                      if not (root / name).is_file(): missing.append((package['name'], name))
              print('Actual catalog:', len(packages), 'packages;', total, 'declared skill paths;', len(missing), 'missing')
              for name, source in missing: print('Missing catalog source:', name, source)
              if missing: raise SystemExit(1)
          check_catalog()
          # Negative control in the disposable checkout; always restore.
          hidden = path.with_name('SKILL.md.pilot-hidden')
          assert not hidden.exists()
          path.rename(hidden)
          try:
              try:
                  check_catalog()
              except SystemExit as exc:
                  assert exc.code == 1
                  print('CATALOG_NEGATIVE_CONTROL_PASS: missing source rejected')
              else:
                  raise RuntimeError('Missing source was accepted')
          finally:
              hidden.rename(path)
          check_catalog()
          print('CATALOG_GUARD_PASS')
          # Controlled smoke fixture, not historical automation evidence.
          snapshot = {'automations': [
              {'id':'pilot-idle','is_enabled':True,'run_details':{'last_run':{'id':'1','recorded_status':'completed'},'latest_result':{'content_text':'0 п.п.'}}},
              {'id':'pilot-fail','is_enabled':True,'run_details':{'last_run':{'id':'2','recorded_status':'failed'}}}
          ]}
          with tempfile.TemporaryDirectory() as tmp:
              p = pathlib.Path(tmp)
              (p/'snapshot.json').write_text(json.dumps(snapshot), encoding='utf-8')
              subprocess.run(['python3',str(root/'packages/skill-synergy-manager/scripts/nexus_automation_audit.py'),str(p/'snapshot.json'),'--out',str(p/'audit.json')],check=True)
              result = json.loads((p/'audit.json').read_text())
              assert result['active_tasks_checked'] == 2
              kinds = {i['kind'] for t in result['tasks'] for i in t['issues']}
              assert {'possibly_idle_run','failed'} <= kinds, result
              print('Existing Nexus audit executed; controlled fixture classified correctly:', sorted(kinds))
          print('SOURCE_RUNNER_PASS; native ChatGPT skill access and native installed skill execution not tested')
          PY
