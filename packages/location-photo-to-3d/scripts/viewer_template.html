<!doctype html>
<html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>ЛОКАЦИЯ — 3D</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d17;font:13px system-ui,sans-serif;color:#edf6fc}body{background:radial-gradient(ellipse at 50% 12%,__SKY_LIGHT__ 0%,__SKY__ 65%,#080b12 100%)}#scene{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}#name{position:absolute;top:23px;left:23px;letter-spacing:.24em;font-weight:700;opacity:.88}#meta{position:absolute;top:51px;left:23px;font:11px system-ui;opacity:.55}#help{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font:11px system-ui;opacity:.64;text-align:center;white-space:nowrap}#joystick{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:24px;width:120px;height:120px;border-radius:50%;border:1px solid #fff5;background:#ffffff0a;display:none;pointer-events:auto;touch-action:none}#knob{width:49px;height:49px;border-radius:50%;border:1px solid #fffa;background:#ffffff35;position:absolute;left:35px;top:35px;transform:translate(0,0)}#reset{position:absolute;top:19px;right:18px;pointer-events:auto;cursor:pointer;border:1px solid #a5b6c555;color:#e9f0f8;background:#101c2b8a;padding:9px 14px;border-radius:18px}#error{position:absolute;top:45%;left:10%;right:10%;text-align:center;color:#ffd6cb;font-weight:500;display:none}@media(hover:none),(pointer:coarse){#joystick{display:block}#help{bottom:20px;left:auto;right:18px;transform:none;white-space:normal;width:180px;text-align:right}}
</style></head><body><canvas id="scene"></canvas><div id="hud"><div id="name">Л О К А Ц И Я</div><div id="meta">__DEPTH_MODE__ • CPU reconstruction • offline</div><button id="reset">⟲ Вид</button><div id="help">WASD — движение · стрелки / мышь — обзор · Shift — быстрее</div><div id="joystick"><div id="knob"></div></div><div id="error"></div></div>
<script>
'use strict';
const CONTENT = __SCENE_DATA__;
const canvas=document.getElementById('scene'), gl=canvas.getContext('webgl2',{alpha:true,antialias:true,powerPreference:'high-performance'});
const error=(s)=>{const e=document.getElementById('error');e.style.display='block';e.textContent=s};
if(!gl){error('Для 3D требуется браузер с WebGL2.');throw Error('WebGL2 unavailable')}
const vsource=`#version 300 es
precision highp float;
in vec3 aP;in vec2 aT;uniform mat4 uVP;uniform vec3 uEye;out vec2 vT;out float vDist;
void main(){vT=aT;vDist=distance(aP,uEye);gl_Position=uVP*vec4(aP,1.0);}`;
const fsource=`#version 300 es
precision highp float;
in vec2 vT;in float vDist;uniform sampler2D uTex;uniform vec3 uFogColor;uniform float uFogNear;uniform float uFogFar;out vec4 outColor;
void main(){vec4 t=texture(uTex,vT);float fog=smoothstep(uFogNear,uFogFar,vDist);vec3 rgb=mix(t.rgb,uFogColor,0.25*fog);outColor=vec4(rgb,t.a);}`;
function shader(kind,source){const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vsource));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fsource));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const A=gl.getAttribLocation(program,'aP'),T=gl.getAttribLocation(program,'aT');const uVP=gl.getUniformLocation(program,'uVP'),uEye=gl.getUniformLocation(program,'uEye'),uFogColor=gl.getUniformLocation(program,'uFogColor'),uFogNear=gl.getUniformLocation(program,'uFogNear'),uFogFar=gl.getUniformLocation(program,'uFogFar');
const b64=(s)=>{const raw=atob(s);const a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a.buffer};
const images=[];const meshes=[];
for(const m of CONTENT.meshes){const verts=b64(m.positions_uvs),idx=b64(m.indices);const vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);gl.enableVertexAttribArray(A);gl.vertexAttribPointer(A,3,gl.FLOAT,false,20,0);gl.enableVertexAttribArray(T);gl.vertexAttribPointer(T,2,gl.FLOAT,false,20,12);gl.bindVertexArray(null);const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([153,149,148,255]));gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);const image=new Image();image.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);gl.generateMipmap(gl.TEXTURE_2D);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false)};image.src=m.texture;images.push(image);meshes.push({vao,tex,count:m.index_count})}
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);const S=CONTENT.camera;const camera={x:S[0],y:S[1],z:S[2],yaw:0,pitch:0};const initial={...camera};const keys=new Set();onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D','Shift'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase())};onkeyup=e=>keys.delete(e.key.toLowerCase());addEventListener('blur',()=>keys.clear());document.getElementById('reset').onclick=()=>Object.assign(camera,initial);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));const look=(dx,dy)=>{camera.yaw-=dx*0.004;camera.pitch=clamp(camera.pitch-dy*0.004,-1.4,1.4)};
let mouse=null;canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.clientX<150&&e.clientY>innerHeight-150)return;mouse={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!mouse||e.pointerId!==mouse.id)return;look(e.clientX-mouse.x,e.clientY-mouse.y);mouse.x=e.clientX;mouse.y=e.clientY});const stop=e=>{if(mouse?.id===e.pointerId)mouse=null};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
const joy=document.getElementById('joystick'),knob=document.getElementById('knob');let joyID=null,jx=0,jy=0;const jmove=e=>{const r=joy.getBoundingClientRect();jx=clamp((e.clientX-(r.left+r.width/2))/44,-1,1);jy=clamp((e.clientY-(r.top+r.height/2))/44,-1,1);knob.style.transform=`translate(${jx*38}px,${jy*38}px)`};joy.addEventListener('pointerdown',e=>{joyID=e.pointerId;joy.setPointerCapture(joyID);jmove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyID)jmove(e)});function endJoy(e){if(e.pointerId===joyID){joyID=null;jx=jy=0;knob.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
function projection(fov,aspect,near,far){const f=1/Math.tan(fov/2),nf=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0])}
function normalize(v){const s=Math.hypot(...v)||1;return v.map(x=>x/s)}function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function view(eye,forward){const z=normalize(forward.map(x=>-x)),x=normalize(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x[0]*eye[0]-x[1]*eye[1]-x[2]*eye[2],-y[0]*eye[0]-y[1]*eye[1]-y[2]*eye[2],-z[0]*eye[0]-z[1]*eye[1]-z[2]*eye[2],1])}
function mul(a,b){const c=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)c[i+j*4]+=a[i+k*4]*b[k+j*4];return c}
const tone=CONTENT.fog;gl.uniform3f(uFogColor,tone[0],tone[1],tone[2]);gl.uniform1f(uFogNear,CONTENT.fog_range[0]);gl.uniform1f(uFogFar,CONTENT.fog_range[1]);let last=performance.now();
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;const w=Math.max(1,Math.floor(canvas.clientWidth*Math.min(devicePixelRatio,2))),h=Math.max(1,Math.floor(canvas.clientHeight*Math.min(devicePixelRatio,2)));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}const turn=(keys.has('arrowright')?1:0)-(keys.has('arrowleft')?1:0),tilt=(keys.has('arrowup')?1:0)-(keys.has('arrowdown')?1:0);camera.yaw+=turn*dt*1.5;camera.pitch=clamp(camera.pitch+tilt*dt*1.5,-1.4,1.4);const forward=(keys.has('w')?1:0)-(keys.has('s')?1:0)-jy,side=(keys.has('d')?1:0)-(keys.has('a')?1:0)+jx;const speed=dt*(keys.has('shift')?4:1.5);camera.x+=(Math.sin(camera.yaw)*forward+Math.cos(camera.yaw)*side)*speed;camera.z+=(-Math.cos(camera.yaw)*forward+Math.sin(camera.yaw)*side)*speed;
const dir=[Math.sin(camera.yaw)*Math.cos(camera.pitch),Math.sin(camera.pitch),-Math.cos(camera.yaw)*Math.cos(camera.pitch)];const p=projection(CONTENT.fov*Math.PI/180,w/h,.02,1000);const v=view([camera.x,camera.y,camera.z],dir);gl.uniformMatrix4fv(uVP,false,mul(p,v));gl.uniform3f(uEye,camera.x,camera.y,camera.z);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);for(const m of meshes){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,m.tex);gl.bindVertexArray(m.vao);gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
