<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSIC — Magenta motifs</title><style>body{font:16px system-ui;background:#151620;color:#e8e3d9;max-width:620px;margin:3rem auto;padding:1rem}label{display:block;margin:1rem 0}button,input{font:inherit}button{padding:.75rem 1.2rem}pre{white-space:pre-wrap}</style><h1>MUSIC / Magenta</h1><p>Загрузите JSON исходной пьесы и, при наличии, существующий банк мотивов. Модель создаст продолжение по аккордам пьесы.</p><label>Пьеса (.json) <input id="piece" type="file" accept=".json"></label><label>Банк мотивов (.json, необязательно) <input id="bank" type="file" accept=".json"></label><label>Начальный такт (0 = первый) <input id="bar" type="number" min="0" value="0"></label><label>Тактов продолжения <input id="bars" type="number" min="1" max="4" value="2"></label><button id="go">Создать мотивы</button> <button id="save" disabled>Сохранить JSON</button><pre id="status" role="status"></pre><script src="https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1/dist/magentamusic.js"></script><script src="https://cdn.jsdelivr.net/npm/tonal@6.9.0/browser/tonal.min.js"></script><script type="module">
import {MagentaMotifs} from './magenta_bridge.mjs';
const $=id=>document.getElementById(id);let model,output;const read=async id=>{const f=$(id).files[0];if(!f)return null;if(f.size>12e6)throw Error('Файл слишком большой');return JSON.parse(await f.text());};
$('go').onclick=async()=>{ $('go').disabled=true;$('save').disabled=true;output=null;$('status').textContent='Загрузка модели / генерация…';try{const data=await read('piece');if(!data)throw Error('Выберите пьесу');model??=new MagentaMotifs(globalThis.mm,globalThis.Tonal??null);const r=await model.generate(data.piece??data,{bar:Number($('bar').value),bars:Number($('bars').value),previous:await read('bank')});output=r.bank;$('status').textContent=JSON.stringify(output,null,2);$('save').disabled=false;}catch(e){$('status').textContent='Ошибка: '+e.message;}finally{$('go').disabled=false;}};
$('save').onclick=()=>{if(!output)return;const url=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='magenta-motifs.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
