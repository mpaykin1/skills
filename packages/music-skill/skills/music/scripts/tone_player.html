<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSIC — Tone.js</title><style>body{font:16px system-ui;background:#17191e;color:#f2eee5;max-width:600px;margin:10vh auto;padding:24px}button,select,input{font:inherit;margin:8px;padding:9px}button{cursor:pointer}#status{color:#b5b9c3}</style><h1>MUSIC · Live audio</h1><p>Оригинальные композиции из MUSIC или бесконечная музыка Modular Riffs.</p><input type="file" id="file" accept=".json"><button id="play">Играть JSON</button><button id="live">Живая музыка</button><button id="stop">Стоп</button><p><select id="mood"><option value="calm">Покой</option><option value="danger">Опасность</option><option value="combat">Бой</option><option value="victory">Победа</option></select><label>Громкость <input type="range" id="vol" min="0" max="1" step=".01" value=".8"></label></p><p><label><input type="checkbox" id="realpiano"> Salamander Grand Piano (локальный банк)</label></p><p id="credit"></p><p id="status">Подготовка…</p><script src="https://cdn.jsdelivr.net/npm/tone@14.9.17/build/Tone.js"></script><script type="module">
import {ToneMusic,createToneVoices} from './tone_bridge.mjs';
import {loadSalamander} from './salamander_bridge.mjs';
const $=id=>document.getElementById(id), status=s=>$('status').textContent=s;let player;let action=0;let sampleBank=null;let loading=null;
try{player=new ToneMusic(globalThis.Tone,{voices:T=>createToneVoices(T,{salamander:$('realpiano').checked?sampleBank:null}),onError:e=>status(e.message)});player.setVolume(.8);status('Готово. Выберите JSON или живой режим.');}catch(e){status('Tone.js недоступен: '+e.message);}
async function preparePiano(id){if(!$('realpiano').checked)return; if(!sampleBank){loading??=loadSalamander(Tone,undefined,{onProgress:(a,b)=>{if(id===action)status(`Рояль: ${a}/${b}`);}}).finally(()=>{loading=null;});sampleBank=await loading;}if(id===action)$('credit').textContent=sampleBank.credit+' https://creativecommons.org/licenses/by/3.0/';}
const go=fn=>async()=>{const id=++action;player?.stop();try{if(!player)throw Error('Tone.js не загружен');await fn(id);}catch(e){if(id===action)status(e.message);}};
$('play').onclick=go(async id=>{const f=$('file').files[0];if(!f)throw Error('Выберите JSON композиции');await Tone.start();await preparePiano(id);const data=JSON.parse(await f.text());if(id!==action)return;await player.start(data);status('Воспроизведение JSON');});
$('live').onclick=go(async id=>{await Tone.start();await preparePiano(id);const {loadModular,LiveRiffs}=await import('./modular_bridge.mjs');const api=await loadModular();if(id!==action)return;await player.start(new LiveRiffs(api,{style:'cinematic',seed:'symphonia'}),{live:true});status('Непрерывная генерация');});
$('realpiano').onchange=()=>{action++;player?.stop();status('Выберите воспроизведение для нового инструмента');};
$('stop').onclick=()=>{action++;player?.stop();status('Остановлено');};$('vol').oninput=()=>player?.setVolume(Number($('vol').value));
$('mood').onchange=()=>{if(!player?.running||!player.live)return;const changes={calm:{style:'ambient',energy:.2,bpm:66},danger:{style:'cinematic',energy:.65,bpm:92},combat:{style:'rock',energy:.95,bpm:132},victory:{style:'gospel',energy:.7,bpm:108}};player.request(changes[$('mood').value]);status('Новый характер со следующего незапланированного такта');};
</script></html>
